name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  NEXT_PUBLIC_API_URL: http://api-marketplace.tuneboss-landing.dasrams.biz.id/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build admin panel
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build

      - name: Package admin panel
        shell: bash
        run: |
          mkdir -p deploy/admin/.next
          cp -R frontend/.next/standalone/. deploy/admin/
          cp -R frontend/.next/static deploy/admin/.next/static
          cp -R frontend/public deploy/admin/public
          tar -C deploy/admin -czf admin.tar.gz .

      - name: Start SSH agent
        shell: bash
        env:
          CPANEL_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          printf '%s\n' "$CPANEL_SSH_KEY" | ssh-add -

      - name: Add cPanel host key
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -p "$CPANEL_PORT" "$CPANEL_HOST" >> ~/.ssh/known_hosts && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Deploy and restart admin panel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
          CPANEL_USER: ${{ secrets.CPANEL_SSH_USER }}
        run: |
          set -euo pipefail
          archive="/home/$CPANEL_USER/.admin-${GITHUB_SHA}.tar.gz"
          ssh -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "cat > '$archive'" < admin.tar.gz
          ssh -p "$CPANEL_PORT" "$CPANEL_USER@$CPANEL_HOST" "bash -s -- '$archive'" <<'REMOTE'
          set -euo pipefail
          app="/home/$(whoami)/apps/tuneboss-admin-panel/frontend"
          stage="${app}.stage"
          trap 'rm -rf -- "$stage"; rm -f -- "$1"' EXIT
          rm -rf -- "$stage"
          mkdir -p "$stage" "$app"
          tar -xzf "$1" -C "$stage"
          test -f "$stage/server.js"
          find "$app" -mindepth 1 -maxdepth 1 ! -name tmp -exec rm -rf -- {} +
          cp -a "$stage/." "$app/"
          cloudlinux-selector restart --json --interpreter=nodejs --app-root=apps/tuneboss-admin-panel/frontend
          REMOTE
