name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  NEXT_PUBLIC_API_URL: http://api-marketplace.tuneboss-landing.dasrams.biz.id/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build admin panel
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run build

      - name: Package admin panel
        shell: bash
        run: |
          mkdir -p deploy/admin
          cp -R frontend/out/. deploy/admin/
          tar -C deploy/admin -czf admin.tar.gz .

      - name: Deploy admin panel
        shell: bash
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_USER: ${{ secrets.CPANEL_SSH_USER }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
        run: |
          set -euo pipefail
          base="https://${CPANEL_HOST}:2083"
          cookie="$(mktemp)"
          login="$(curl -ksS -c "$cookie" -d "user=${CPANEL_USER}" --data-urlencode "pass=${CPANEL_PASSWORD}" "$base/login/?login_only=1")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["security_token"])' <<< "$login")"
          curl -ksS -b "$cookie" -F "dir=/home/${CPANEL_USER}" -F "file-1=@admin.tar.gz;filename=admin-static.tar.gz" "$base${token}/execute/Fileman/upload_files" | grep -q '"status":1'
          curl -ksS -b "$cookie" -G "$base${token}/json-api/cpanel" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=fileop" \
            --data-urlencode "op=extract" \
            --data-urlencode "sourcefiles=/home/${CPANEL_USER}/admin-static.tar.gz" \
            --data-urlencode "destfiles=/home/${CPANEL_USER}/public_html/apps/tuneboss-admin-panel/frontend" \
            --data-urlencode "doubledecode=1" | grep -q '"result":1'
